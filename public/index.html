<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#4f46e5">
<title>Painel financeiro · Meta Terracap</title>
<style>
:root{--bg:#f4f6fb;--card:#ffffff;--soft:#eef1f8;--tx:#0f172a;--tx2:#475569;--tx3:#94a3b8;--bd:#e2e8f0;--pri:#4f46e5;--pri2:#818cf8;--teal:#0d9488;--amber:#d97706;--rose:#e11d48;--sky:#0284c7;--ok:#059669;--warn:#d97706;--bad:#e11d48;--shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.06);--r:18px}
html[data-theme=dark]{--bg:#0b1020;--card:#141a2e;--soft:#1c2440;--tx:#e8ecf6;--tx2:#a5b0c8;--tx3:#6b7794;--bd:#263052;--pri:#818cf8;--pri2:#a5b4fc;--teal:#2dd4bf;--amber:#fbbf24;--rose:#fb7185;--sky:#38bdf8;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.hwrap{max-width:1200px;margin:0 auto;padding:12px 16px 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--pri),var(--teal));display:grid;place-items:center;color:#fff;font-weight:700}
.brand h1{font-size:17px;margin:0;line-height:1.2}.brand small{color:var(--tx3);font-size:12px;display:block}
.icon-btn{border:1px solid var(--bd);background:var(--card);color:var(--tx2);border-radius:12px;width:38px;height:38px;cursor:pointer;font-size:17px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:0;background:transparent;color:var(--tx2);padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--pri);color:#fff}
main{max-width:1200px;margin:0 auto;padding:18px 16px 90px}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 0 14px}
.sec-title h2{font-size:22px;margin:0}.sec-title p{margin:0;color:var(--tx3);font-size:13px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:760px){.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1100px){.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 4px;font-size:16px}.card .sub{color:var(--tx3);font-size:13px;margin:0 0 12px}
.kpi{padding:16px;position:relative;overflow:hidden}
.kpi .lbl{font-size:12.5px;color:var(--tx2);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:6px 0 2px;line-height:1.15;word-break:break-word}
.kpi .det{font-size:12px;color:var(--tx3)}
.kpi .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.kpi.hl{background:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 60%,var(--teal)));border:0;color:#fff}.kpi.hl .lbl,.kpi.hl .det{color:rgba(255,255,255,.85)}
.chart{position:relative;width:100%;height:260px}.chart.tall{height:320px}.chart.sm{height:200px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft);color:var(--tx2)}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}.pill.pri{background:color-mix(in srgb,var(--pri) 14%,transparent);color:var(--pri)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.mut{color:var(--tx3)}
.list{display:flex;flex-direction:column}.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd)}.li:last-child{border-bottom:0}
.li .n{font-weight:500}.li .d{font-size:12.5px;color:var(--tx3)}.li .v{font-weight:600;text-align:right;white-space:nowrap}
.alert{display:flex;gap:12px;padding:14px;border-radius:14px;background:var(--soft);margin-bottom:10px}
.alert .ic{flex:0 0 32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:#fff}
.alert.bad .ic{background:var(--bad)}.alert.warn .ic{background:var(--warn)}.alert.ok .ic{background:var(--ok)}
.alert .t{font-weight:600}.alert .d{font-size:13px;color:var(--tx2)}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:9px 14px;font:inherit;font-weight:500;cursor:pointer}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.sm{padding:6px 10px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:760px){.fields{grid-template-columns:repeat(4,minmax(0,1fr))}}
.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--tx2);font-weight:500;min-width:0}
.f.full{grid-column:1/-1}
input[type=text],input[type=date],select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;font:inherit;font-size:15px}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--pri) 45%,transparent);border-color:var(--pri)}
.sw{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--tx);cursor:pointer}
.sw input{appearance:none;width:42px;height:24px;border-radius:999px;background:var(--bd);position:relative;cursor:pointer;transition:.2s;flex:0 0 auto;margin:0}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw input:checked{background:var(--pri)}.sw input:checked::after{left:21px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--bd);background:var(--card);font-size:13px;cursor:pointer;user-select:none}
.chip input{display:none}.chip.on{background:color-mix(in srgb,var(--teal) 14%,transparent);border-color:var(--teal);color:var(--teal);font-weight:600}
.chip.off{background:color-mix(in srgb,var(--rose) 10%,transparent);border-color:color-mix(in srgb,var(--rose) 50%,transparent);color:var(--rose)}
details.card>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"▾";color:var(--tx3)}details[open].card>summary::after{content:"▴"}
details.card[open]>summary{margin-bottom:14px}
.tw{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:13.5px}th{text-align:left;color:var(--tx3);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:8px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}td{padding:7px 6px;border-bottom:1px solid var(--bd);vertical-align:middle}.r{text-align:right}
td input[type=text]{padding:6px 8px;font-size:14px;min-width:84px}td input.w{min-width:170px}td select{padding:6px;min-width:120px;font-size:14px}
.x{border:0;background:var(--soft);color:var(--tx2);border-radius:8px;width:30px;height:30px;cursor:pointer}
.cota-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.cota-head .tt{font-weight:700;font-size:16px}.cota-head .gg{font-size:12.5px;color:var(--tx3)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.stat{background:var(--soft);border-radius:12px;padding:9px 10px}.stat .l{font-size:11.5px;color:var(--tx3)}.stat .v{font-weight:700;font-size:15px}
.gauge{margin:6px 0 4px}.gauge .track{position:relative;height:12px;border-radius:999px;background:var(--soft);overflow:visible}
.gauge .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--pri2),var(--pri))}
.gauge .zone{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--teal) 30%,transparent)}
.gauge .mk{position:absolute;top:-4px;width:2px;height:20px;background:var(--tx2)}
.gauge .lab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx3);margin-top:6px}
.note{font-size:13px;color:var(--tx2);background:var(--soft);border-radius:12px;padding:10px 12px;margin:10px 0}
.eq{font-family:ui-serif,Georgia,serif;font-size:15px;text-align:center;padding:12px;background:var(--soft);border-radius:12px;margin-top:12px}
.sheet-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:40;display:none}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));display:none;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
@media(min-width:760px){.sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:720px;border-radius:22px;max-height:90vh}}
.sheet.open,.sheet-bg.open{display:block}
.sheet h3{margin:0 0 2px}.sheet .grp{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);font-weight:700;margin:16px 0 8px}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em}
.legend-dots{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--tx2);margin-bottom:8px}.legend-dots i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.empty{color:var(--tx3);font-size:14px}
footer{max-width:1200px;margin:0 auto;padding:0 16px 40px;color:var(--tx3);font-size:12px}
</style>
</head>
<body>
<header><div class="hwrap">
 <div class="top"><div class="brand"><div class="logo">V</div><div><h1>Painel financeiro</h1><small>Meta: quitar o lote Terracap</small></div></div>
 <button class="icon-btn" id="theme" title="Tema claro/escuro">◐</button></div>
 <nav class="tabs" id="tabs"></nav>
</div></header>
<main id="main"></main>
<footer>Valores iniciais de 15/11/2026. O que você digita fica salvo só neste navegador. Estimativas, não recomendação de investimento.</footer>
<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet"></div>

function cenBem(m){const P=S.p;const marg=num(P.margem);const e=num(P.embMax);const T=C.T;const rows=[];
const calc=S.cotas.map((c0,i)=>{const k=corteEf(c0);if(!c0.ativa||c0.contemplada||m===null)return Object.assign({},C.cc[i],{corte:k.v,est:k.est});const c=effCota(c0);const lp=Math.max(k.v+marg,num(c0.lancePct));const carta=Math.round(num(c0.carta)*m);const y=calcCota(Object.assign({},c,{embutidoPct:String(Math.min(e,lp)),pManual:""}),C.fy,carta,lp);y.corte=k.v;y.est=k.est;return y});
S.cotas.forEach((c0,i)=>{if(c0.ativa&&!c0.contemplada)rows.push(calc[i])});
const sum=f=>rows.reduce((s,x)=>s+f(x),0);const tot={carta:sum(x=>x.carta),E:sum(x=>x.E),cash:sum(x=>x.livre),S:sum(x=>x.S),parc:sum(x=>x.parcela),net:sum(x=>x.net),gain:sum(x=>x.net-x.livre),pMed:rows.length?sum(x=>x.p)/rows.length:0};
const cons=m===null?C.cons:consFor(tot.cash);const fl=flowsFor(calc,cons.K);const mc=monteCarlo(calc,fl.base,C.pay,1500,P.mensal,T,99,cons.K);
const ganhoT=cons.jl+(C.payNo[T]-C.pay[T])+(C.atrasoT===0?C.pay[T]*num(P.premio)/100:0);
return{m,nome:m===null?"Lances atuais":`Bens +${Math.round((m-1)*100)}%`,rows,tot,cons,serie:fl.serie,gapT:fl.serie[T]-C.pay[T],prob:mc.prob[T],ganhoT,saldoCons:ganhoT-cons.custo}}
function bestCB(){let b=null;C.cb.forEach(x=>{if(x.m===null)return;if(!b||x.prob>b.prob+1e-9||(Math.abs(x.prob-b.prob)<=1e-9&&x.gapT>b.gapT))b=x});return b}

function gauge(c,x){const mn=num(c.vencMin),md=num(c.vencMed),mxv=num(c.vencMax);const top=Math.max(100,x.lp,mn,md,mxv);const P=v=>Math.min(100,v/top*100);const zoneStart=mn||md;return`<div class="gauge"><div class="track">${zoneStart?`<div class="zone" style="left:${P(zoneStart)}%;right:0"></div>`:""}<div class="fill" style="width:${P(x.lp)}%"></div>${mn?`<div class="mk" style="left:${P(mn)}%" title="mínimo"></div>`:""}${md&&md!==mn?`<div class="mk" style="left:${P(md)}%"></div>`:""}${mxv?`<div class="mk" style="left:${P(mxv)}%"></div>`:""}</div><div class="lab"><span>Seu lance: <b style="color:var(--tx)">${pn(x.lp)}</b></span><span>${mn?`menor contemplado ${pn(mn)}`:"corte não informado"}${md&&md!==mn?` · médio ${pn(md)}`:""}${mxv?` · máx ${pn(mxv)}`:""}</span></div></div>`}

function otimizar(){compute();const P=S.p,T=C.T,fy=C.fy,orc=C.orc;const mults=[0.8,0.9,1,1.1,1.2];const cartas=S.cotas.map(c=>num(c.carta)),lances=S.cotas.map(c=>num(c.lancePct));
const baseFor=calc=>{const consM=calc.filter(c=>c.ativa).reduce((x,c)=>x+c.parcela,0);return C.fixos.base.map((b,t)=>b+(C.fixos.cons[t]-consM)*(t+1))};
const avaliar=(cs,ls)=>{const calc=S.cotas.map((c,i)=>calcCota(c,fy,cs[i],ls[i]));const g=calc.filter((c,i)=>c.ativa&&!S.cotas[i].contemplada).reduce((x,c)=>x+c.livre,0);const r=monteCarlo(calc,baseFor(calc),C.pay,700,P.mensal,T,777);return r.prob[T]*1e9+r.media/1e3};
const antes=monteCarlo(C.cc,C.fixos.base,C.pay,700,P.mensal,T,777).prob[T];let best=avaliar(cartas,lances);
for(let pass=0;pass<2;pass++)S.cotas.forEach((c,i)=>{if(!c.ativa||c.contemplada)return;const orig=num(c.cartaOrig);const mn=num(c.vencMin),md=num(c.vencMed)||mn,mx=num(c.vencMax)||md+5;const lo=String(c.pManual??"").trim()!==""?[lances[i]]:[...new Set([0,mn,md,mx].filter(v=>v>=0))];for(const m of mults)for(const lp of lo){const cs=cartas.slice(),ls=lances.slice();cs[i]=Math.round(orig*m);ls[i]=lp;const v=avaliar(cs,ls);if(v>best){best=v;cartas[i]=cs[i];lances[i]=lp}}});
const calc=S.cotas.map((c,i)=>calcCota(c,fy,cartas[i],lances[i]));sug={cartas,lances,antes,depois:monteCarlo(calc,baseFor(calc),C.pay,700,P.mensal,T,777).prob[T]};renderOut()}
function migrate(){if(!INICIAL)return;const rev=S.rev||0;
INICIAL.cotas.forEach(ic=>{let c=S.cotas.find(x=>x.id===ic.id);if(!c){S.cotas.push(clone(ic));return}for(const k in ic)if(c[k]===undefined)c[k]=clone(ic[k]);if(rev<(INICIAL.rev||0)){(ic.conf||[]).forEach(k=>{c[k]=clone(ic[k])});c.conf=Array.from(new Set([...(c.conf||[]),...(ic.conf||[])]));if(ic.nota)c.nota=ic.nota;c.desc=ic.desc}});
S.ativos.forEach(a=>{const ia=INICIAL.ativos.find(x=>x.id===a.id);if(a.inst===undefined)a.inst=ia?ia.inst:""});
for(const k in INICIAL.p)if(S.p[k]===undefined)S.p[k]=INICIAL.p[k];for(const k in INICIAL)if(S[k]===undefined)S[k]=clone(INICIAL[k]);if(S.p.consTaxa==="1,34"&&INICIAL.p.consTaxa!=="1,34")S.p.consTaxa=INICIAL.p.consTaxa;
if(rev<9&&(INICIAL.rev||0)>=9){S.rendas=clone(INICIAL.rendas);S.dividas=clone(INICIAL.dividas)}if(rev<10&&(INICIAL.rev||0)>=10){const ic=INICIAL.cotas.find(x=>x.id==="c6");if(ic){let c=S.cotas.find(x=>x.id==="c6");if(c){for(const k in ic)c[k]=clone(ic[k])}else S.cotas.push(clone(ic))}INICIAL.cotas.forEach(ic=>{if(!S.cotas.find(x=>x.id===ic.id))S.cotas.push(clone(ic))});if(INICIAL.historico)S.historico=clone(INICIAL.historico)}S.rev=INICIAL.rev||0}
async function decifrar(){const k=new URLSearchParams(location.hash.slice(1)).get("k");if(!k||typeof ENC==="undefined")return null;try{const raw=Uint8Array.from(atob(k.replace(/-/g,"+").replace(/_/g,"/")),ch=>ch.charCodeAt(0));const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);const iv=Uint8Array.from(atob(ENC.iv),ch=>ch.charCodeAt(0));const ct=Uint8Array.from(atob(ENC.ct),ch=>ch.charCodeAt(0));const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);return JSON.parse(new TextDecoder().decode(pt))}catch(e){return null}}

function taxaImp(pv,pm,n){let lo=0,hi=0.2;if(pm*n<=pv)return 0;for(let k=0;k<80;k++){const i=(lo+hi)/2;const v=pm*(1-Math.pow(1+i,-n))/i;if(v>pv)lo=i;else hi=i}return(lo+hi)/2}
function balAmort(pv,pm,i,k){if(k<=0)return pv;const b=i>0?pv*Math.pow(1+i,k)-pm*(Math.pow(1+i,k)-1)/i:pv-pm*k;return Math.max(0,b)}
function perdaoEnt(e){const P=S.p;if(!e)return num(P.perdao)/100;const k=e<=5?"refisTab5":e<=10?"refisTab10":"refisTab15";return num(P[k])/100}
function proj(o,N){N=N||NL;const P=S.p;const cdi=(o.cdi!==undefined?o.cdi:num(P.cdi))/100;const ipca=(o.ipca!==undefined?o.ipca:num(P.ipca))/100;const ir=num(P.ir)/100;

const vL0=num(P.valorLote),vg=Math.pow(1+num(P.valLote)/100,1/12)-1;const resMin=num(P.reservaMin);const isNub=d=>d.id.startsWith("nub");
const divs=S.dividas.filter(d=>!d.folha&&!(P.quitarNubank&&isNub(d))&&!(P.quitPes&&d.id==="d2")).map(d=>{const pv=num(d.saldo),pm=d.id==="d2"&&P.portB?num(P.portBParc):num(d.parcela),n=Math.round(num(d.restantes));return{pv,pm,n,i:pv>0&&pm>0&&n>0?taxaImp(pv,pm,n):0}});
const iliq=Math.max(0,C.patrimonio-C.R0);const dB=S.dividas.find(d=>d.id==="d2");const dA=S.dividas.find(d=>d.id==="d1");let R=C.R00-(P.quitPes&&dB?num(dB.saldo):0)-((P.portA||(P.portB&&!P.quitPes))?num(P.portCusto):0);let B=num(P.saldoLote);let over=[];let quit=-1,vend=-1;const mode=o.lote||"plano";let reg=false;
const refisOn=o.refis!==undefined?o.refis:!!P.refis;const rIni=o.refisMes!==undefined?o.refisMes:Math.round(num(P.refisMes));const rFim=o.adere==="inicio"?rIni:rIni+Math.max(0,Math.round(num(P.refisJanela))-1);const ent=o.entrada!==undefined?o.entrada:num(P.refisEntrada);
const calc=o.calc||C.cc;const cont=o.cont||calc.map((x,i)=>S.cotas[i].contemplada?x.asm:-1);const cons=o.cons||null;const phi=cons&&cons.K?cons.K.phi:0;const ci=cons?cons.i:0,cfac=cons?cons.fac:0,cn=cons?cons.n:0;
const renda0=(o.renda!==undefined?o.renda:rendaUsada())+(P.portA&&dA?num(dA.parcela)-num(P.portAParc):0)-((P.portA||P.portB)?num(P.portSeg):0);const desp=despAtual();const tr=[];

for(let t=0;t<N;t++){if(R>0)R*=1+rNet;const renda=renda0+(o.extra&&t>=o.extra.mes?o.extra.v:0);let saq=0,cin=0,ven=0,lan=0,cp=0,cnov=0,ter=0,dv=0;let cart=0,pcs=0;

calc.forEach((x,k)=>{if(!x.ativa)return;const m=cont[k];const rest=Math.round(num(S.cotas[k].restantes))||999;if(m>=0){if(t<=m+6)cp+=x.parcela;if(t<m){pg[k]+=x.parcela;cart+=pg[k]*ffk[k]}if(t===m){lan+=x.livre;if(phi>0&&x.livre>0){const v=phi*x.livre;cin+=v;tr.push({m,v})}}if(t===m+6)saq+=x.net;if(t>=m&&t<m+6){cart+=x.credito;pcs+=Math.max(0,x.S-x.L-x.parcela*(t-m))}}else if(t<rest){cp+=x.parcela;pg[k]+=x.parcela;cart+=pg[k]*ffk[k]}});

let enc=0;if(quit<0){B=B*(1+j)*(1+im);const pagar=mode==="emdia"||reg?true:mode==="plano"?(t<NM?!!S.pagarLote[t]:true):(t===0&&!!S.pagarLote[0]);if(pagar){B=Math.max(0,B-parcL);ter+=parcL}else{over.push(t);out.naoPagas=(out.naoPagas||0)+parcL}
enc=over.reduce((s,q)=>s+parcL*(multa+jm*(t-q)),0);const inW=refisOn&&t>=rIni&&t<=rFim;

out.aLote[t]=vend>=0&&t>=vend?0:vL0*Math.pow(1+vg,t+1);out.aInv[t]=Math.max(0,R)+iliq;out.aCartas[t]=cart;out.pTerra[t]=out.loteDue[t];out.pConsig[t]=divs.reduce((s,d)=>s+(t<d.n?balAmort(d.pv,d.pm,d.i,t+1):0),0)+bNovo;out.pCons[t]=pcs;out.pNeg[t]=Math.max(0,-R);
out.pl[t]=out.aLote[t]+out.aInv[t]+out.aCartas[t]-out.pTerra[t]-out.pConsig[t]-out.pCons[t]-out.pNeg[t]}

const oEm={cont:none,lote:"emdia",quitAuto:false};const nEm=rendaNec(oEm);const oQ={cont:none,lote:"emdia",quitAuto:true};const okQ=r=>r.quit>=0&&r.quit<=alvo&&r.minCash>=num(P.reservaMin)-1;const nQ=rendaNec(oQ,okQ);const nQ2=rendaNec({cont:all,cons:C.cons,lote:"plano",quitAuto:true},okQ);

function gVar(c0,v){const P=S.p;const k=corteEf(c0);const c=effCota(c0);const lp=Math.max(k.v+num(P.margem),num(c0.lancePct));const e=v==="emb"?Math.min(num(P.embMax),lp):0;const y=calcCota(Object.assign({},c,{embutidoPct:String(e),pManual:""}),C.fy,num(c0.carta),lp);y.corte=k.v;y.est=k.est;y.v=v;y.e=e;y.dParc=y.parcela-num(c0.parcela);return y}
function gObj(r){return S.p.gestObj==="terracap"?r.cash[NL-1]-r.loteDue[NL-1]:r.pl[NL-1]}
function gEval(sched,vars,renda,V){const P=S.p;const calc=S.cotas.map((c,i)=>sched[i]>=0&&!c.contemplada?V[i][vars[i]]:C.cc[i]);const cont=S.cotas.map((c,i)=>c.contemplada?C.cc[i].asm:sched[i]);const cash=calc.reduce((s,x,i)=>s+(sched[i]>=0&&!S.cotas[i].contemplada?x.livre:0),0);const cons=P.gestCons?consFor(cash):null;
const r=proj({calc,cont,cons,lote:S.p.gLote||"emdia",quitAuto:true,renda});return{r,calc,cont,cons,feas:r.minCash>=num(P.reservaMin)-1&&(S.p.gLote==="naopaga"||r.riskIni<0),obj:gObj(r)}}
function gMC(sched,vars,renda,V,runs,seed){const rnd=mulberry32(seed);const P=S.p;let so=0,low=0,qt=0;const calcB=S.cotas.map((c,i)=>sched[i]>=0&&!c.contemplada?V[i][vars[i]]:C.cc[i]);
for(let k=0;k<runs;k++){const cont=S.cotas.map((c,i)=>{if(c.contemplada)return C.cc[i].asm;if(sched[i]<0)return-1;const p=calcB[i].p;for(let t=sched[i];t<NL;t++)if(rnd()<p)return t;return-1});const cash=calcB.reduce((s,x,i)=>s+(cont[i]>=0&&!S.cotas[i].contemplada?x.livre:0),0);const r=proj({calc:calcB,cont,cons:P.gestCons?consFor(cash):null,lote:S.p.gLote||"emdia",quitAuto:true,renda});so+=gObj(r);if(r.minCash<num(P.reservaMin)-1)low++;if(r.quit>=0)qt++}
return{eObj:so/runs,pLow:low/runs,pQuit:qt/runs}}
function gestao(renda,full){const P=S.p;const idx=S.cotas.map((c,i)=>i).filter(i=>S.cotas[i].ativa&&!S.cotas[i].contemplada&&!S.cotas[i].formacao);const V=S.cotas.map(c=>({emb:gVar(c,"emb"),din:gVar(c,"din")}));const none=S.cotas.map(()=>-1);const base=gEval(none,none.map(()=>"din"),renda,V);
const ind={};idx.forEach(i=>{ind[i]={};["emb","din"].forEach(v=>{const s=none.slice();s[i]=0;const vv=none.map(()=>v);ind[i][v]=gEval(s,vv,renda,V).obj-base.obj})});
const subs=[];const rec=(st,a)=>{if(a.length)subs.push(a.slice());if(a.length===3)return;for(let k=st;k<idx.length;k++){a.push(idx[k]);rec(k+1,a);a.pop()}};rec(0,[]);
const cands=[];for(const mode of ["emb","din","misto"]){const vars=S.cotas.map((c,i)=>mode==="misto"?(ind[i]&&ind[i].emb>=ind[i].din?"emb":"din"):mode);
const order=idx.slice().sort((a,b)=>(ind[b]?ind[b][vars[b]]:0)-(ind[a]?ind[a][vars[a]]:0));
for(const sub of subs){const sched=none.slice();sub.forEach(i=>sched[i]=0);let ev=gEval(sched,vars,renda,V);if(!ev.feas){cands.push({mode,sub,sched,vars,ev});continue}
for(const k of order){if(sched[k]>=0)continue;for(let t=1;t<=NL-7;t++){sched[k]=t;const e2=gEval(sched,vars,renda,V);if(e2.feas&&e2.obj>ev.obj+1){ev=e2;break}sched[k]=-1}}
cands.push({mode,sub,sched:sched.slice(),vars,ev})}}
const seen=new Set();const uniq=cands.filter(c=>{const key=c.sched.map((t,i)=>t>=0?t+c.vars[i]:"-").join("|");if(seen.has(key))return false;seen.add(key);return true});
const feas=uniq.filter(c=>c.ev.feas).sort((a,b)=>b.ev.obj-a.ev.obj);const nMC=full?14:4,runs=full?160:60;
feas.slice(0,nMC).forEach((c,k)=>{c.mc=gMC(c.sched,c.vars,renda,V,runs,900+k)});
feas.forEach(c=>{c.cash0=c.sub.reduce((s,i)=>s+V[i][c.vars[i]].livre,0)});const top=feas.filter(c=>c.mc).sort((a,b)=>{const d=b.mc.eObj-a.mc.eObj;return Math.abs(d)>2000?d:(a.cash0-b.cash0)||(b.ev.r.minCash-a.ev.r.minCash)});const best=top[0]||null;const tight=uniq.slice().sort((a,b)=>b.ev.r.minCash-a.ev.r.minCash)[0]||null;
let mais=null;if(best&&full){const sched=best.sched.slice();let ev=best.ev;const order=idx.slice().sort((a,b)=>(ind[b]?ind[b][best.vars[b]]:0)-(ind[a]?ind[a][best.vars[a]]:0));for(const k of order){if(sched[k]>=0)continue;for(let t=1;t<=NL-7;t++){sched[k]=t;const e2=gEval(sched,best.vars,renda,V);if(e2.feas){ev=e2;break}sched[k]=-1}}if(sched.some((t,i)=>t!==best.sched[i]))mais={sub:best.sub,sched,vars:best.vars,ev,mode:best.mode}}
const todasS=S.cotas.map((c,i)=>idx.includes(i)?0:-1);const todas=gEval(todasS,best?best.vars:none.map(()=>"emb"),renda,V);
return{V,base,ind,cands:uniq,feas,top,best,tight,mais,todas,renda,nInf:uniq.length-feas.length}}
function runG(){if(C._g)return C._g;const r=rendaUsada();const g=gestao(r,true);g.sens=[15000,20000,25000,30000].map(v=>({v,g:v===Math.round(r)?g:gestao(v,false)}));C._g=g;return g}

mk("c-cr-100",{type:"bar",data:{labels:opts.map(o=>o.n),datasets:[{label:"Custo nominal",data:opts.map(o=>nom(o.F)),backgroundColor:opts.map(o=>o.col),borderRadius:5},{label:"Custo em valor presente",data:opts.map(o=>pv(o.F)),backgroundColor:opts.map(o=>o.col+"77"),borderRadius:5}]},options:{indexAxis:"y",scales:{x:{ticks:{callback:v=>mil(v)},grid:{color:css("--bd")}},y:{grid:{display:false},ticks:{font:{size:10.5},callback:function(v){const t=this.getLabelForValue(v);const m=innerWidth<600?18:40;return t.length>m?t.slice(0,m-1)+"…":t}}}},plugins:{tooltip:{callbacks:{label:c=>c.dataset.label+": "+brl0(c.parsed.x)}}}}});
const H=Math.min(200,Math.max(...opts.map(o=>o.F.length)));const cum=F=>{let s=0;return Array.from({length:H},(_,t)=>{s+=F[t]||0;return s})};
mk("c-cr-cum",{type:"line",data:{labels:Array.from({length:H},(_,t)=>t%12===0?"ano "+t/12:""),datasets:opts.map((o,k)=>({label:o.n,data:cum(o.F),borderColor:k<bc.slice(0,3).length?[css("--teal"),css("--pri"),css("--tx3")][k]:o.col,borderDash:k>=3&&o.F===opts[opts.length-1].F?[5,3]:[],pointRadius:0,borderWidth:2,tension:.2}))},options:{interaction:{mode:"index",intersect:false},scales:{y:yMil,x:{grid:{display:false},ticks:{autoSkip:false,maxRotation:0}}},plugins:{tooltip:{callbacks:{title:c=>"mês "+c[0].dataIndex,label:c=>c.dataset.label+": "+brl0(c.parsed.y)}}}}});
const names=[...new Set(R.mixes.flatMap(m=>m.parts.map(p=>p.n)))];const pal=[css("--teal"),css("--pri"),"#14b8a6","#6366f1",css("--amber"),"#f97316",css("--rose"),"#be123c","#64748b"];
mk("c-cr-mix",{type:"bar",data:{labels:R.mixes.map(m=>mil(m.T)+" · CET "+fcet(m.cet)),datasets:names.map((n,k)=>({label:n,data:R.mixes.map(m=>(m.parts.find(p=>p.n===n)||{}).v||0),backgroundColor:pal[k%pal.length]}))},options:{indexAxis:"y",scales:{x:{stacked:true,ticks:{callback:v=>mil(v)},grid:{color:css("--bd")}},y:{stacked:true,grid:{display:false}}},plugins:{legend:{position:"bottom",labels:{boxWidth:10,font:{size:10}}},tooltip:{callbacks:{label:c=>c.dataset.label+": "+brl0(c.parsed.x)}}}}})};
// integrações
function credCard(R,title){const b=R.plans[0];return`<div class="card" style="margin-top:14px"><div class="row" style="justify-content:space-between"><h3>${title}</h3><button class="btn" onclick="TAB='credito';renderTab();scrollTo(0,0)">Ver custo do crédito</button></div><p class="sub">CET equivalente (% a.m.) contra consignado BB ${pn(R.cB.cet*100)} e pessoal BB ${pn(R.pB.cet*100)}, com IOF; Terracap em dia ${pn(R.lim.lote*100)}.</p><div class="list">${(b?[vLine(b.n,b.cet,R)]:[]).concat(R.cotas.map(c=>vLine(c.nome,c.cet,R))).join("")}</div></div>`}
{const o=OUT.resumo;OUT.resumo=()=>o()+credCard(cred(),"Consórcio como crédito: vale a pena?")}
function gCons(){if(C._gc)return C._gc;const v=S.p.gestCons;S.p.gestCons=!v;let g;try{g=gestao(rendaUsada(),false)}finally{S.p.gestCons=v}C._gc=g;return g}
{const o=OUT.gestao;OUT.gestao=()=>{const R=cred();const g=runG();const b=R.plans[0];let muda="";if(g.best){const g2=gCons();const same=g2.best&&planoTxt(g2.best)===planoTxt(g.best);muda=`<p class="note">${S.p.gestCons?"Sem":"Com"} o consignado BB (CET ${pn(R.cB.cet*100)}) como ponte, o melhor plano ${same?"<b>não muda</b>":"<b>muda</b> para: "+esc(g2.best?planoTxt(g2.best):"nenhum viável")}.${!same&&g2.best?` Patrimônio esperado ${mil((g2.best.mc?g2.best.mc.eObj:g2.best.ev.obj)-(g.best.mc?g.best.mc.eObj:g.best.ev.obj))} em relação ao plano acima.`:""}</p>`}
return o()+credCard(R,"Custo do crédito deste plano")+muda}}
{const o=OUT.cenarios;OUT.cenarios=()=>{const R=cred(),Q=cred(num(S.p.stressIpca));const row=(n,a,b)=>{const va=verd(a,R)[0],vb=verd(b,Q)[0];return`<tr><td>${esc(n)}</td><td class="r"><span class="${va==="ok"?"ok":"bad"}">${fcet(a)}</span></td><td class="r"><span class="${vb==="ok"?"ok":"bad"}">${fcet(b)}</span></td><td>${va===vb?"igual":vb==="ok"?"melhora":"piora: "+verd(b,Q)[1]}</td></tr>`};
return o()+`<div class="card" style="margin-top:14px"><h3>Custo do crédito nos cenários</h3><p class="sub">As parcelas do consórcio sobem com a inflação; consignado e pessoal são prefixados. CET equivalente com IPCA de ${pn(num(S.p.ipca))} x ${pn(num(S.p.stressIpca))} a.a. (consignado BB: ${pn(R.cB.cet*100)}).</p><div class="tw"><table><thead><tr><th>Cota ou plano</th><th class="r">IPCA ${pn(num(S.p.ipca))}</th><th class="r">IPCA ${pn(num(S.p.stressIpca))}</th><th>Veredito</th></tr></thead><tbody>${R.plans.map((p,k)=>row(p.n,p.cet,Q.plans[k]?Q.plans[k].cet:NaN)).join("")}${R.cotas.map((c,k)=>row(c.nome,c.cet,Q.cotas[k].cet)).join("")}</tbody></table></div></div>`}}
// ======== Dívidas reais, portabilidade e combinações ========
function withP(o,f){const P=S.p;const old={};for(const k in o){old[k]=P[k];P[k]=o[k]}try{return f()}finally{for(const k in o)P[k]=old[k]}}
const COMB=[["Como está hoje",{portA:false,portB:false,quitPes:false}],["Portabilidade das duas dívidas (Sicoob)",{portA:true,portB:true,quitPes:false}],["Quitar o pessoal com a reserva + portar o consignado",{portA:true,portB:false,quitPes:true}]];
function dvOpts(){if(C._dv)return C._dv;const r=rendaUsada();const L=[];for(const lote of ["emdia","naopaga"])COMB.forEach(([n,o])=>{const g=withP(Object.assign({gLote:lote},o),()=>gestao(r,false));const b=g.best;const ref=b?b.ev:g.base;L.push({n,lote,o,g,b,r:ref.r,obj:b?(b.mc?b.mc.eObj:b.ev.obj):-Infinity,base:g.base.r})});
L.forEach(x=>{const t=(x.g.cands||[]).slice().sort((a,b)=>b.ev.r.minCash-a.ev.r.minCash)[0];x.tight=t;if(!x.b&&t){x.r=t.ev.r;x.b=t}});const feas=L.filter(x=>x.g.feas&&x.g.feas.length).sort((a,b)=>b.obj-a.obj);const rec=feas[0]||L.slice().sort((a,b)=>b.r.minCash-a.r.minCash)[0];C._dv={L,rec,ok:!!feas.length};return C._dv}
function debts(){const P=S.p;const A=S.dividas.find(d=>d.id==="d1"),B=S.dividas.find(d=>d.id==="d2");const irrD=(pv,pm,n)=>taxaImp(pv,pm,n);const R=cred();const L=[];
if(B)L.push({n:"Pessoal BB (Crédito Renovação)",saldo:num(B.saldo),pm:num(B.parcela),nr:num(B.restantes),tx:num(B.taxa),i:irrD(num(B.saldo),num(B.parcela),num(B.restantes)),tag:"atual",lbl:"CET pela DDC"});
if(B)L.push({n:"Pessoal portado para o Sicoob (proposta)",saldo:num(B.saldo),pm:num(P.portBParc),nr:num(B.restantes),tx:num(P.portBTaxa),i:irrD(num(B.saldo),num(P.portBParc),num(B.restantes)),tag:"prop",lbl:"taxa ofertada"});
if(A)L.push({n:"Consignado BB (em folha)",saldo:num(A.saldo),pm:num(A.parcela),nr:num(A.restantes),tx:num(A.taxa),i:irrD(num(A.saldo),num(A.parcela),num(A.restantes)),tag:"atual",lbl:"taxa contratual"});
if(A)L.push({n:"Consignado portado para o Sicoob (proposta)",saldo:num(A.saldo),pm:num(P.portAParc),nr:num(A.restantes),tx:num(P.portATaxa),i:irrD(num(A.saldo),num(P.portAParc),num(A.restantes)),tag:"prop",lbl:"taxa ofertada"});
L.push({n:"Terracap (lote, em dia)",saldo:num(P.saldoLote),pm:num(P.parcelaLote),nr:0,tx:num(P.jurosLote),i:R.lim.lote,tag:"atual",lbl:"juros + IPCA"});
return{L:L.sort((a,b)=>b.i-a.i),A,B,R}}
function fluxoMes(o){const P=S.p;return withP(o,()=>{const D=debts();const rd=rendaUsada()+(P.portA&&D.A?num(D.A.parcela)-num(P.portAParc):0);const pes=P.quitPes||!D.B?0:P.portB?num(P.portBParc):num(D.B.parcela);const cons=C.cc.filter((x,i)=>x.ativa&&!S.cotas[i].contemplada&&!S.cotas[i].formacao).reduce((s,x)=>s+x.parcela,0);const desp=despAtual();const ter=num(P.parcelaLote);return{rd,pes,cons,desp,ter,saldo:rd-pes-cons-desp-ter,saldoSemT:rd-pes-cons-desp}})}
function dividasHTML(){const D=debts();const P=S.p;const R=D.R;const ec=D.B?num(D.B.parcela)*num(D.B.restantes)-num(D.B.saldo):0;const sB=D.B?num(D.B.parcela)-num(P.portBParc):0,sA=D.A?num(D.A.parcela)-num(P.portAParc):0;
const f0=fluxoMes({portA:false,portB:false,quitPes:false}),f1=fluxoMes({portA:true,portB:true,quitPes:false}),f2=fluxoMes({portA:true,portB:false,quitPes:true});const X=dvOpts();
const fl=(n,f)=>`<tr><td>${n}</td><td class="r">${brl0(f.rd)}</td><td class="r">${brl0(f.pes)}</td><td class="r">${brl0(f.cons)}</td><td class="r">${brl0(f.ter)}</td><td class="r">${brl0(f.desp)}</td><td class="r"><b class="${f.saldo>=0?"ok":"bad"}">${brl0(f.saldo)}</b><div class="d">sem Terracap ${brl0(f.saldoSemT)}</div></td></tr>`;
const cv=num((S.despesas.find(d=>d.id==="e1")||{}).valor);const rc=X.rec;
const op=x=>{const r=x.r;return`<tr${x===rc?' style="background:var(--soft)"':""}><td>${esc(x.n)}<div class="d">Terracap ${x.lote==="emdia"?"em dia":"pausada até o Refis"}</div></td><td>${x.b?esc(planoTxt(x.b)):"<span class='bad'>nenhum lance cabe</span>"}</td><td class="r"><span class="${r.minCash>=num(P.reservaMin)?"ok":"bad"}">${brl0(r.minCash)}</span><div class="d">${mesLong(r.minMes)}</div></td><td class="r">${r.riskIni>=0?`<span class="bad">${mesLong(r.riskIni)}</span>`:"—"}</td><td class="r">${r.quit>=0?mesLong(r.quit):"—"}</td><td class="r">${mil(r.pl[NL-1])}</td></tr>`};
return`<div class="card" style="margin-top:14px;border-top:4px solid var(--rose)"><h3>Seu caixa mensal real (set/2026)</h3><p class="sub">Renda líquida de ${brl0(rendaUsada())} (CBMDF já sem o consignado BB de ${D.A?brl0(num(D.A.parcela)):"—"} + SSP). ${cv>0?"":"<b>Custo de vida ainda em branco</b>: o déficit real é maior. "}</p><div class="tw"><table><thead><tr><th>Opção</th><th class="r">Renda</th><th class="r">Pessoal</th><th class="r">Consórcios</th><th class="r">Terracap</th><th class="r">Despesas</th><th class="r">Sobra/falta</th></tr></thead><tbody>${fl("Hoje",f0)}${fl("Portabilidade das duas",f1)}${fl("Quitar pessoal + portar consignado",f2)}</tbody></table></div><p class="note">Pagando tudo, falta dinheiro todo mês: a reserva de ${brl0(C.R00)} cobre ${f0.saldo<0?Math.floor(C.R00/-f0.saldo)+" meses":"o período"}. Esse é o ponto central do plano.</p></div>
<div class="card" style="margin-top:14px"><h3>Suas dívidas pela taxa (avalanche: pague primeiro a mais cara)</h3><div class="list">${D.L.map((d,k)=>`<div class="li" style="align-items:flex-start"><div style="min-width:0"><div class="n">${k+1}. ${esc(d.n)}</div><div class="d">Saldo ${brl0(d.saldo)} · ${d.nr?d.nr+"x ":""}${brl0(d.pm)} · ${d.lbl} ${pn(d.tx)} a.m.</div></div><div class="v">${pill(pn(d.i*100)+" a.m.",d.i>R.cB.cet?"bad":d.i>R.lim.cdi?"warn":"ok")}<div class="d">taxa implícita</div></div></div>`).join("")}</div>
<p style="margin-top:10px"><b>Pessoal BB:</b> ${pn(debts().L.find(d=>d.n.startsWith("Pessoal BB")).i*100)} a.m. é a dívida mais cara, quatro vezes o que a reserva rende (${pn(R.lim.cdi*100)}). Quitar hoje custa ${brl0(D.B?num(D.B.saldo):0)} e evita ${brl0(ec)} de juros, liberando ${brl0(D.B?num(D.B.parcela):0)}/mês. A portabilidade para o Sicoob baixa a parcela em ${brl0(sB)}/mês (${brl0(sB*(D.B?num(D.B.restantes):0))} no total) sem usar a reserva. <b>Consignado:</b> a portabilidade economiza ${brl0(sA)}/mês (${brl0(sA*(D.A?num(D.A.restantes):0))} em ${D.A?D.A.restantes:0} meses); vale fazer se não houver custo escondido. Confira cota-parte de capital e seguro do Sicoob (campos editáveis: custo único ${brl0(num(P.portCusto))}, seguro ${brl0(num(P.portSeg))}/mês).</p></div>
<div class="card" style="margin-top:14px;border-top:4px solid var(--teal)"><h3>Gestão ótima com seus números reais</h3><p style="font-size:15.5px;line-height:1.55">${X.ok?`Melhor combinação: <b>${esc(rc.n)}</b>, com a Terracap <b>${rc.lote==="emdia"?"em dia":"pausada até o Refis"}</b>. Lances: <b>${esc(planoTxt(rc.b))}</b>. Menor caixa ${brl0(rc.r.minCash)} (${mesLong(rc.r.minMes)})${rc.r.riskIni>=0?`; <b class="bad">risco de execução</b> (90 dias de atraso na Terracap) a partir de ${mesLong(rc.r.riskIni)}, por isso a adesão ao Refis precisa sair antes`:""}${rc.r.quit>=0?`; Terracap quitada em ${mesLong(rc.r.quit)}`:""}.`:`<b class="bad">Nenhuma combinação mantém o caixa acima da reserva mínima.</b> A menos ruim é <b>${esc(rc.n)}</b> com a Terracap ${rc.lote==="emdia"?"em dia":"pausada até o Refis"}: o caixa chega a ${brl0(rc.r.minCash)} em ${mesLong(rc.r.minMes)}${rc.r.riskIni>=0?` e o risco de execução começa em ${mesLong(rc.r.riskIni)}`:""}. Sem aumento de renda ou corte de gastos, não dê lance com dinheiro.`}</p>
<div class="tw"><table><thead><tr><th>Combinação</th><th>Lances</th><th class="r">Menor caixa</th><th class="r">Risco 90 dias</th><th class="r">Terracap quitada</th><th class="r">PL dez/28</th></tr></thead><tbody>${X.L.map(op).join("")}</tbody></table></div><p class="note">Cada linha roda a Gestão ótima inteira (1 a 3 cotas agora, as demais quando o caixa permitir) com a reserva mínima de ${brl0(num(P.reservaMin))}. "Pausada até o Refis" deixa de pagar a Terracap até a adesão, como no cenário de alavancagem; o risco de 90 dias é o prazo para a Terracap poder executar.</p></div>`}
CTL.credito=(o=>()=>o()+`<div class="card" style="margin-top:14px"><h3>Dívidas e portabilidade</h3><div class="fields"><label class="sw"><input type="checkbox" data-k="p.portA"> Portar o consignado para o Sicoob</label><label class="f">Parcela consignado Sicoob (R$)<input type="text" data-k="p.portAParc" inputmode="decimal"></label><label class="sw"><input type="checkbox" data-k="p.portB"> Portar o pessoal para o Sicoob</label><label class="f">Parcela pessoal Sicoob (R$)<input type="text" data-k="p.portBParc" inputmode="decimal"></label><label class="sw"><input type="checkbox" data-k="p.quitPes"> Quitar o pessoal com a reserva</label><label class="f">Custo único da portabilidade (cota-parte, R$)<input type="text" data-k="p.portCusto" inputmode="decimal"></label><label class="f">Seguro Sicoob (R$/mês)<input type="text" data-k="p.portSeg" inputmode="decimal"></label><label class="f">Margem consignável livre (R$/mês)<input type="text" data-k="p.margemLivre" inputmode="decimal"></label></div><p class="note">As opções escolhidas aqui valem para todas as abas.</p></div>`)(CTL.credito);
{const o=OUT.credito;OUT.credito=()=>dividasHTML()+o()}
{const o=OUT.resumo;OUT.resumo=()=>{const f=fluxoMes({});const X=dvOpts();const rc=X.rec;return`<div class="alert ${f.saldo<0?"bad":"ok"}" style="margin-top:14px"><div class="ic">!</div><div style="flex:1"><div class="t">Caixa mensal: ${f.saldo<0?"falta":"sobra"} ${brl0(Math.abs(f.saldo))}/mês pagando tudo</div><div class="d">${X.ok?`Melhor caminho: ${esc(rc.n)}, Terracap ${rc.lote==="emdia"?"em dia":"pausada até o Refis"}; ${esc(planoTxt(rc.b))}.`:`Nenhuma combinação segura a reserva mínima; a menos ruim é ${esc(rc.n)}.`} Detalhes em Custo do crédito.</div></div></div>`+o()}}

{const o=OUT.credito;OUT.credito=()=>o()+faixasHTML()}

if(!S){$("main").innerHTML='<div class="card" style="margin-top:20px"><h3>Painel financeiro</h3><p>Abra este painel pelo link completo recebido por e-mail.</p></div>';$("tabs").innerHTML="";return}
migrate();save();if(!TABS.some(t=>t[0]===TAB))TAB="resumo";renderTab();if(QS.get("edit")!==null)openSheet(+QS.get("edit"))})();
